{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Data Kategori</h4>

<form method="post" action="{{ url_for('kategori_simpan') }}" class="card card-body mb-4">
    <input type="hidden" name="id_kategori" value="{{ edit.id_kategori if edit else '' }}">
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Nama Kategori</label>
            <input type="text" name="nama_kategori" class="form-control" required
                   value="{{ edit.nama_kategori if edit else '' }}">
        </div>
        <div class="col-md-5">
            <label class="form-label">Keterangan</label>
            <input type="text" name="keterangan" class="form-control"
                   value="{{ (edit.keterangan or '') if edit else '' }}">
        </div>
        <div class="col-md-3 d-flex align-items-end gap-2">
            <button class="btn btn-success">{{ 'Update' if edit else 'Tambah' }}</button>
            {% if edit %}<a href="{{ url_for('kategori') }}" class="btn btn-secondary">Batal</a>{% endif %}
        </div>
    </div>
</form>

<table class="table table-striped table-bordered bg-white align-middle">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nama Kategori</th><th>Keterangan</th><th style="width:150px">Aksi</th></tr>
    </thead>
    <tbody>
        {% for k in data %}
        <tr>
            <td>{{ k.id_kategori }}</td>
            <td>{{ k.nama_kategori }}</td>
            <td>{{ k.keterangan }}</td>
            <td>
                <a href="{{ url_for('kategori_edit', id=k.id_kategori) }}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{ url_for('kategori_hapus', id=k.id_kategori) }}" method="post" class="d-inline"
                      onsubmit="return confirm('Hapus kategori ini?')">
                    <button class="btn btn-sm btn-danger">Hapus</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
