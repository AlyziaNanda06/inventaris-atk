{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Barang Keluar</h4>

<form method="post" class="card card-body mb-4">
    <div class="row g-3">
        <div class="col-md-5">
            <label class="form-label">Barang</label>
            <select name="id_barang" class="form-select" required>
                <option value="" disabled selected>-- pilih barang --</option>
                {% for b in barang_list %}
                <option value="{{ b.id_barang }}">
                    {{ b.kode_barang }} - {{ b.nama_barang }} (stok: {{ b.stok }} {{ b.satuan }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Tanggal Keluar</label>
            <input type="date" name="tanggal_keluar" class="form-control" required value="{{ hari_ini }}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Jumlah</label>
            <input type="number" name="jumlah" min="1" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Tujuan / Penerima</label>
            <input type="text" name="tujuan" class="form-control" placeholder="Contoh: Bagian Keuangan" required>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-success">Simpan Barang Keluar</button>
        </div>
    </div>
</form>

<div class="table-responsive">
<table class="table table-striped table-bordered bg-white align-middle">
    <thead class="table-dark">
        <tr><th>Tanggal</th><th>Barang</th><th>Jumlah</th><th>Tujuan</th></tr>
    </thead>
    <tbody>
        {% for k in data %}
        <tr>
            <td>{{ k.tanggal_keluar }}</td>
            <td>{{ k.nama_barang }}</td>
            <td>{{ k.jumlah }} {{ k.satuan }}</td>
            <td>{{ k.tujuan }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
