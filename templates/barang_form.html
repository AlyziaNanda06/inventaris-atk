{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">{{ judul }}</h4>

<form method="post" class="card card-body">
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Kode Barang</label>
            <input type="text" name="kode_barang" class="form-control" required
                   value="{{ item.kode_barang if item else '' }}">
        </div>
        <div class="col-md-8">
            <label class="form-label">Nama Barang</label>
            <input type="text" name="nama_barang" class="form-control" required
                   value="{{ item.nama_barang if item else '' }}">
        </div>
        <div class="col-md-5">
            <label class="form-label">Kategori</label>
            <select name="id_kategori" class="form-select" required>
                <option value="" disabled {{ 'selected' if not item }}>-- pilih kategori --</option>
                {% for k in kategori_list %}
                <option value="{{ k.id_kategori }}"
                    {{ 'selected' if item and item.id_kategori|int == k.id_kategori }}>
                    {{ k.nama_kategori }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Satuan</label>
            <input type="text" name="satuan" class="form-control" placeholder="pcs, box, rim..."
                   value="{{ item.satuan if item else '' }}">
        </div>
        <div class="col-md-4">
            <label class="form-label">Stok Minimum</label>
            <input type="number" name="stok_minimum" min="0" class="form-control" required
                   value="{{ item.stok_minimum if item else 5 }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Harga Beli (Rp)</label>
            <input type="number" name="harga_beli" min="0" class="form-control" required
                   value="{{ item.harga_beli|int if item else 0 }}">
        </div>
        <div class="col-md-6">
            <label class="form-label">Harga Jual (Rp)</label>
            <input type="number" name="harga_jual" min="0" class="form-control" required
                   value="{{ item.harga_jual|int if item else 0 }}">
        </div>
    </div>
    <p class="text-muted small mt-3 mb-0">Stok tidak diedit di sini. Stok berubah otomatis lewat menu Barang Masuk dan Barang Keluar.</p>
    <div class="mt-3">
        <button type="submit" class="btn btn-success">Simpan</button>
        <a href="{{ url_for('barang') }}" class="btn btn-secondary">Batal</a>
    </div>
</form>
{% endblock %}
